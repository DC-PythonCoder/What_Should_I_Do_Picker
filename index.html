<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>What Should I Do?</title>

    <link rel="stylesheet" href="src/style.css">
    <script src="src/script.js" defer></script>
</head>

<body>
    <main class="picker">
        <p class="eyebrow">ACTIVITY PICKER</p>

        <h1>What should I do? 🎲</h1>

        <p class="description">
            Can't decide? Let chance choose your next activity.
        </p>

        <div class="result" aria-live="polite">
            <p>Your next activity</p>
            <h2 id="activity-result">Ready when you are.</h2>
        </div>

        <button id="pick-button" type="button">Pick for me</button>
    </main>
</body>
</html>
